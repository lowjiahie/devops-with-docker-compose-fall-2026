services:
  app:
    build: .
    ports:
      - "127.0.0.1:18091:8080"
    volumes:
      - ./app.py:/app/app.py:ro
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
